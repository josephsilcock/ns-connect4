name: Validation

on:
  workflow_call:
  pull_request:
  schedule:
    - cron: "0 8 * * 2"

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98

      - name: "Setup Node.js"
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version-file: ".nvmrc"

      - name: "Install Dependencies"
        run: npm ci --no-audit

      # Prisma 7 has no install-time generate step, so the client must be
      # generated explicitly. Generation reads the datasource URL from
      # prisma.config.ts but never connects, so a placeholder is sufficient.
      - name: "Generate Prisma Client"
        run: npm run db:generate
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/postgres"

      - name: "Run Linter"
        run: npm run lint

      - name: "Run Typecheck"
        run: npm run typecheck

      - name: "Run Unit Tests"
        run: npm run test
